<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AstraMart - an eye-catching Vue 3 SPA built with TypeScript, Tailwind CSS, Pinia, and DummyJSON."
    />
    <title>AstraMart | Neon Commerce Galaxy</title>
    <script>
      const storedTheme = localStorage.getItem('astramart.theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', storedTheme ? storedTheme === 'dark' : prefersDark);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
